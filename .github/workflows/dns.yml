# Points api.votain.app at whichever backend was just deployed.
#
# WHY THIS EXISTS. The two backends answer the same hostname, and the frontend
# bakes that hostname at build time and never learns which host is behind it.
# So switching between them is a DNS change and nothing else -- and until now
# it was a DNS change somebody had to remember to make, from a JSON file in
# OneDrive, at the end of a deployment they had already stopped watching. The
# failure that produces is the quiet one: an enclave running perfectly, and
# unreachable by name.
#
# IT ONLY ACTS ON A REAL SWITCH. If the records already point where this
# deployment wants them, it changes nothing and says so. Rewriting the same
# records on every redeploy would be churn with a blast radius: each write is a
# chance to break name resolution for a service that was working, and TLS
# issuance rides on two of these records.
#
# THE TWO SETS ARE NOT SYMMETRIC, and the asymmetry is load-bearing:
#
#   heroku  one proxied CNAME. Heroku's ACM issues the certificate, and it
#           cannot do that while a CAA record restricts issuance to a
#           Let's Encrypt account that belongs to the enclave. So the CAA and
#           the TXT are REMOVED, not left lying around.
#
#   phala   three records: the same CNAME, plus the two `dstack-ingress` wrote
#           when it provisioned the zone. The CAA authorises the enclave's own
#           ACME account over DNS-01; the TXT tells the dstack gateway which
#           app and port to route to. Without them the ingress cannot get a
#           certificate, and the CNAME alone resolves to a gateway that will
#           not answer for this name.
#
# BOTH CNAMEs ARE PROXIED. The ingress wrote its own record unproxied and that
# is how the enclave was first verified, so this is a deliberate departure
# rather than the default. Nothing about the proxy should trouble it: DNS-01
# validation runs on a TXT record, which is never proxied, and the origin
# already serves a certificate valid for this name, so Cloudflare reaches it
# over TLS like any other origin. If the ingress ever fails to renew, this is
# the first thing to suspect and one boolean to change back.
#
# MEASURED, NOT ASSUMED: `dstack-ingress` writes these records only on FIRST
# provisioning. Deleting them and restarting the CVM does not bring them back
# -- tested, by deleting them and waiting five minutes. That is why they are
# kept here rather than trusted to reappear.

name: dns

on:
  workflow_call:
    inputs:
      target:
        description: 'Which backend api.votain.app should point at: heroku or phala'
        required: true
        type: string
      force:
        description: 'Rewrite the records even if they already point at the target'
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      target:
        description: 'Which backend api.votain.app should point at'
        required: true
        type: choice
        options: [heroku, phala]
      # FOR CHANGING THE SHAPE OF A SET, not for retrying. The guard below
      # compares hosts, so it cannot see that the CNAME should now be proxied
      # when it already names the right one. Without this, altering the Phala
      # records meant switching away to Heroku and back -- downtime, and a
      # certificate reissue, to change one boolean.
      force:
        description: 'Rewrite the records even if they already point at the target'
        required: false
        default: false
        type: boolean

env:
  ZONA: votain.app
  NOMBRE: api.votain.app
  TXT_NOMBRE: _dstack-app-address.api.votain.app
  HEROKU_CNAME: primal-avocado-jx6kkx3psf223fbhwacju7kk.herokudns.com
  PHALA_CNAME: gateway.dstack-pha-prod9.phala.network
  PHALA_CAA: 'letsencrypt.org;validationmethods=dns-01;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/3774891496'
  PHALA_TXT: '8a4883de0784b3d5a4c8cd66738e9f559400b32a:443'
  CVM_ID: 8a4883de0784b3d5a4c8cd66738e9f559400b32a
  HEROKU_APP: votain-backend

permissions:
  contents: read

jobs:
  point:
    runs-on: ubuntu-latest
    steps:
      - name: Check the token exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo 'CLOUDFLARE_API_TOKEN is not set, so DNS was left alone.'
            echo 'Create a token scoped to Zone:DNS:Edit on votain.app only,'
            echo 'and add it as a repository secret.'
            exit 1
          fi
          case "${{ inputs.target }}" in
            heroku|phala) : ;;
            *) echo "Unknown target: ${{ inputs.target }}"; exit 1 ;;
          esac

      # ── BRINGING THE DESTINATION UP ─────────────────────────────────────────
      #
      # BEFORE the records move, so the hostname is never pointed at something
      # that is switched off. The reverse order would be a gap of one minute
      # during which api.votain.app resolves to a dyno scaled to zero, or to a
      # gateway in front of a stopped enclave.
      #
      # This repeats what `deploy-heroku.yml` and `deploy-phala.yml` already do
      # before they hand over, and the repetition is deliberate rather than
      # sloppy. Both operations are idempotent, so on the normal path this
      # costs a few seconds and changes nothing -- and it means this workflow
      # is safe to run ON ITS OWN. Without it, a hand-run `dns` switch after
      # the other host had been turned off would move the name onto a dead
      # service; the wait below would refuse to turn anything off, which is a
      # safe failure but leaves the name pointing at nothing.
      - name: Make sure the destination is up
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" = heroku ]; then
            npm install -g heroku --silent
            heroku ps:scale web=1 -a "$HEROKU_APP"
            echo 'Heroku dyno at 1.'
          else
            npm install -g phala --silent
            estado=$(phala cvms get --cvm-id "$CVM_ID" --json | jq -r '.status')
            echo "CVM is $estado"
            if [ "$estado" != running ]; then
              phala cvms start --cvm-id "$CVM_ID"
              for intento in $(seq 1 20); do
                json=$(phala cvms get --cvm-id "$CVM_ID" --json)
                estado=$(printf '%s' "$json" | jq -r '.status')
                curso=$(printf '%s' "$json" | jq -r '.in_progress')
                echo "attempt $intento: status=$estado in_progress=$curso"
                if [ "$estado" = running ] && [ "$curso" = false ]; then
                  break
                fi
                sleep 20
              done
              [ "$estado" = running ] || { echo 'The CVM never came up.'; exit 1; }
            fi
          fi

      - name: Point it
        id: apuntar
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DESTINO: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # SAYING WHAT CLOUDFLARE SAID, because the alternative is a bare `jq`
          # failure and a 403 nobody can act on. A token scoped too narrowly is
          # the likeliest thing to go wrong here, and "Zone:DNS:Edit is missing"
          # is a fix; "jq: error" is an evening.
          api() {
            local metodo="$1" ruta="$2"
            shift 2
            local respuesta
            respuesta=$(curl -sS -X "$metodo" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4$ruta" "$@")
            if ! printf '%s' "$respuesta" | jq -e '.success' >/dev/null 2>&1; then
              echo "Cloudflare refused $metodo $ruta:" >&2
              printf '%s' "$respuesta" | jq -r '.errors[]? | "  [\(.code)] \(.message)"' >&2 \
                || printf '  %s\n' "$respuesta" >&2
              return 1
            fi
            printf '%s' "$respuesta"
          }

          # The zone id is looked up rather than stored: one secret instead of
          # two, and nothing to update if the zone is ever recreated.
          zona=$(api GET "/zones?name=$ZONA" | jq -r '.result[0].id // empty')
          [ -n "$zona" ] || { echo "No zone called $ZONA, or the token cannot see it."; exit 1; }

          registros=$(api GET "/zones/$zona/dns_records?per_page=100")
          cname_id=$(printf '%s' "$registros" | jq -r --arg n "$NOMBRE" '.result[] | select(.type=="CNAME" and .name==$n) | .id' | head -1)
          cname_val=$(printf '%s' "$registros" | jq -r --arg n "$NOMBRE" '.result[] | select(.type=="CNAME" and .name==$n) | .content' | head -1)
          caa_id=$(printf '%s' "$registros" | jq -r --arg n "$NOMBRE" '.result[] | select(.type=="CAA" and .name==$n) | .id' | head -1)
          txt_id=$(printf '%s' "$registros" | jq -r --arg n "$TXT_NOMBRE" '.result[] | select(.type=="TXT" and .name==$n) | .id' | head -1)

          # WHERE IT POINTS NOW, read from the record rather than from anything
          # this repository believes about the last deployment.
          case "${cname_val:-}" in
            *herokudns.com*)  actual=heroku ;;
            *phala.network*)  actual=phala ;;
            '')               actual=none ;;
            *)                actual=unknown ;;
          esac
          echo "api.votain.app currently points at: $actual (${cname_val:-nothing})"
          echo "this deployment wants:              $DESTINO"

          # PUBLISHED FOR THE STEPS BELOW: which host we are leaving, and
          # whether this was a real move. Turning something off is only safe
          # when both are known.
          echo "anterior=$actual" >> "$GITHUB_OUTPUT"
          if [ "$actual" = "$DESTINO" ]; then
            echo 'cambio=no' >> "$GITHUB_OUTPUT"
          else
            echo 'cambio=yes' >> "$GITHUB_OUTPUT"
          fi

          if [ "$actual" = "$DESTINO" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo 'Already there, so nothing was changed.'
            {
              echo "### DNS unchanged"
              echo ''
              echo "\`api.votain.app\` already points at **$DESTINO**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          escribir_cname() {
            local contenido="$1" proxy="$2" ttl="$3"
            local cuerpo
            cuerpo=$(jq -nc --arg n "$NOMBRE" --arg c "$contenido" --argjson p "$proxy" --argjson t "$ttl" \
              '{type:"CNAME",name:$n,content:$c,proxied:$p,ttl:$t}')
            if [ -n "${cname_id:-}" ]; then
              api PUT "/zones/$zona/dns_records/$cname_id" --data "$cuerpo" >/dev/null
            else
              api POST "/zones/$zona/dns_records" --data "$cuerpo" >/dev/null
            fi
          }

          borrar() {
            local id="$1" que="$2"
            [ -n "$id" ] || return 0
            api DELETE "/zones/$zona/dns_records/$id" >/dev/null
            echo "removed the $que record"
          }

          if [ "$DESTINO" = heroku ]; then
            # Proxied, TTL automatic: Cloudflare rejects an explicit TTL on a
            # proxied record.
            escribir_cname "$HEROKU_CNAME" true 1
            echo "CNAME -> $HEROKU_CNAME (proxied)"
            # THE CAA MUST GO. Left in place it authorises only the enclave's
            # Let's Encrypt account over DNS-01, and Heroku's ACM would be
            # unable to issue a certificate for a name it now serves.
            borrar "${caa_id:-}" CAA
            borrar "${txt_id:-}" TXT
          else
            # PROXIED, like Heroku's. `dstack-ingress` wrote this record
            # unproxied when it provisioned the zone, and that is the shape the
            # enclave was first verified in -- but the proxy is wanted here for
            # the same reasons it is wanted on the frontend, and nothing about
            # it should trouble the ingress: DNS-01 validation happens on a TXT
            # record, which is never proxied, and the origin already serves a
            # certificate valid for this name, so Cloudflare can reach it over
            # TLS like any other origin.
            #
            # TTL 1, meaning automatic: Cloudflare rejects an explicit TTL on a
            # proxied record, so 60 here would fail the write.
            escribir_cname "$PHALA_CNAME" true 1
            echo "CNAME -> $PHALA_CNAME (proxied)"
            caa=$(jq -nc --arg n "$NOMBRE" --arg v "$PHALA_CAA" \
              '{type:"CAA",name:$n,ttl:60,data:{flags:0,tag:"issue",value:$v}}')
            if [ -n "${caa_id:-}" ]; then
              api PUT "/zones/$zona/dns_records/$caa_id" --data "$caa" >/dev/null
            else
              api POST "/zones/$zona/dns_records" --data "$caa" >/dev/null
            fi
            echo 'CAA written'
            txt=$(jq -nc --arg n "$TXT_NOMBRE" --arg c "$PHALA_TXT" \
              '{type:"TXT",name:$n,content:$c,ttl:60}')
            if [ -n "${txt_id:-}" ]; then
              api PUT "/zones/$zona/dns_records/$txt_id" --data "$txt" >/dev/null
            else
              api POST "/zones/$zona/dns_records" --data "$txt" >/dev/null
            fi
            echo 'TXT written'
          fi

          # READ BACK, because "the API said success" and "the zone says what we
          # meant" are different claims, and this whole session has been a
          # lesson in not confusing them.
          final=$(api GET "/zones/$zona/dns_records?per_page=100" \
            | jq -r --arg n "$NOMBRE" '.result[] | select(.type=="CNAME" and .name==$n) | .content' | head -1)
          echo "now: $final"
          case "$DESTINO:$final" in
            heroku:*herokudns.com*|phala:*phala.network*) : ;;
            *) echo "The zone does not say what it was told. Got: ${final:-nothing}"; exit 1 ;;
          esac

          {
            echo "### DNS switched to $DESTINO"
            echo ''
            echo "\`api.votain.app\` pointed at **$actual**, and now points at **$final**."
            echo ''
            if [ "$DESTINO" = phala ]; then
              echo 'The CAA and the dstack TXT were written too. The ingress needs'
              echo 'both to obtain its certificate; give it a minute before'
              echo 'expecting HTTPS to answer.'
            else
              echo 'The CAA and the dstack TXT were removed, so ACM can issue.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── SHUTTING DOWN THE ONE WE LEFT ───────────────────────────────────────
      #
      # Paying for two backends to serve the same hostname is waste, and the
      # one nobody is watching is the one that quietly runs up a bill. But
      # turning a service off is irreversible in the only way that matters --
      # for as long as it takes somebody to notice -- so it happens last, and
      # only after the replacement has been seen to answer.
      #
      # ANSWER, not resolve. A CNAME can be correct in the zone while the
      # world still reaches the old host from cache, and Cloudflare can serve
      # a request from the previous origin for a minute after the record
      # changes. What follows checks the reply itself, and knows which host
      # gave it: Heroku's router stamps every response with
      # `via: 1.1 heroku-router`, and the enclave's ingress stamps nothing.
      # That is the difference between "the record says Phala" and "Phala
      # answered", and this session has been a long lesson in not confusing
      # the two.
      - name: Wait for the new host to answer
        if: steps.apuntar.outputs.cambio == 'yes'
        run: |
          set -euo pipefail
          for intento in $(seq 1 20); do
            cabeceras=$(curl -sS -D - -o /dev/null https://api.votain.app/health 2>/dev/null || true)
            codigo=$(printf '%s' "$cabeceras" | head -1 | awk '{print $2}')
            if printf '%s' "$cabeceras" | grep -qi '^via:.*heroku-router'; then
              quien=heroku
            elif [ "${codigo:-}" = 200 ]; then
              quien=phala
            else
              quien=nobody
            fi
            echo "attempt $intento: HTTP ${codigo:-none}, answered by $quien"
            if [ "$quien" = "${{ inputs.target }}" ]; then
              echo "${{ inputs.target }} is serving api.votain.app."
              exit 0
            fi
            sleep 15
          done
          echo 'The new host never answered, so the old one was left running.'
          echo 'Nothing was turned off. Fix the switch first.'
          exit 1

      - name: Turn off the one we left
        if: steps.apuntar.outputs.cambio == 'yes' && steps.apuntar.outputs.anterior != 'none' && steps.apuntar.outputs.anterior != 'unknown'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          ANTERIOR: ${{ steps.apuntar.outputs.anterior }}
        run: |
          set -euo pipefail
          case "$ANTERIOR" in
            heroku)
              # SCALED TO ZERO, not deleted. The app, its config, its domain and
              # its certificate all stay; only the dyno stops, and stops being
              # billed. `deploy-heroku.yml` scales it back up before it releases.
              npm install -g heroku --silent
              heroku ps:scale web=0 -a votain-backend
              echo 'Heroku dyno scaled to 0.'
              linea='The Heroku dyno was scaled to 0. Nothing was deleted.'
              ;;
            phala)
              # STOPPED, not deleted, and the difference is the whole deployment.
              # Deleting a CVM destroys the sealed environment with it: the keys
              # the issuer signs credentials with are encrypted to that instance
              # and do not come back. A stopped CVM keeps its disk, its identity
              # and its measurement, and starts again in about a minute.
              npm install -g phala --silent
              phala cvms stop --cvm-id "$CVM_ID"
              echo 'CVM stopped.'
              linea='The CVM was stopped, not deleted: its sealed environment survives.'
              ;;
            *)
              echo "Nothing to turn off (came from $ANTERIOR)."
              exit 0
              ;;
          esac
          {
            echo ''
            echo "$linea"
          } >> "$GITHUB_STEP_SUMMARY"
