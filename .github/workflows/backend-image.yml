# Builds the issuer image and publishes it, with proof of where it came from.
#
# WHY CI AND NOT A LAPTOP, which is the interesting part and not a convenience
# argument. The TEE attestation proves WHICH IMAGE is running. On its own that
# is half a guarantee: somebody still has to believe the image corresponds to
# the source they read. Build it here and the chain closes, link by link, and
# every link is public:
#
#   public commit -> public build log -> signed provenance -> image digest
#                 -> TEE attestation of that digest
#
# `actions/attest-build-provenance` is what signs the middle of that. It
# records the commit, the workflow and the runner that produced the digest, so
# anyone can run `gh attestation verify` against the published image and see
# whether it really came from this repository.
#
# It also means no long-lived token exists anywhere: `GITHUB_TOKEN` is minted
# for this run, can only write to this repository's packages, and expires when
# the job ends. GHCR does not accept fine-grained personal tokens, so the
# alternative would have been a classic one sitting on a laptop.

name: backend image

on:
  # DELIBERATE RELEASES ONLY. The compose pins an exact tag, because a moving
  # tag means the measurement can change under a running deployment — which is
  # the thing attestation exists to rule out. So this does not fire on every
  # push: it fires when somebody decides a version exists.
  push:
    tags:
      - 'backend-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish, without the leading v (e.g. 0.1.0)'
        required: true
        type: string
      deploy_heroku:
        description: 'Also publish to Heroku and release it there'
        required: false
        default: false
        type: boolean

env:
  # Named once. Changing deployment target should be a one-line edit.
  HEROKU_APP: votain-backend

permissions:
  contents: read
  # Publish to this repository's packages.
  packages: write
  # Sign the provenance. Without this the attestation step cannot mint the
  # short-lived identity it needs, and the chain above loses its middle link.
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # DOCKER REFERENCES MUST BE LOWERCASE and the owner here is `CodeInIA`,
      # so interpolating it directly produces `ghcr.io/CodeInIA/...`, which the
      # registry rejects. GitHub offers no lowercase filter, so it is done here.
      - name: Lowercase the owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # refs/tags/backend-v0.1.0 -> 0.1.0
            echo "value=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          # ONE PLATFORM, ON PURPOSE. The Phala CVM runs amd64. Building arm64
          # as well doubles the push for an architecture nothing here uses,
          # and an image that resolved to arm64 would simply not start there.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/votain-backend:${{ steps.version.outputs.value }}
          # Layers are cached in the registry, so a source-only change does not
          # reinstall 400 MB of zero-knowledge dependencies from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # v4 is a thin wrapper over `actions/attest`, which is where upstream says
      # new work should go. The inputs below are unchanged, so this stays as it
      # is until there is a reason to touch the one step whose output the whole
      # verification story rests on.
      - name: Attest the provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/votain-backend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Say what to pin
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pin this digest in `docker-compose.yml`, not the tag:' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ steps.owner.outputs.value }}/votain-backend:${{ steps.version.outputs.value }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verify it came from this repository:' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gh attestation verify oci://ghcr.io/${{ steps.owner.outputs.value }}/votain-backend:${{ steps.version.outputs.value }} --repo ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── Heroku, which is a different kind of deployment on purpose ──────────
      #
      # WHY THIS IMAGE IS NOT THE ATTESTED ONE, and the difference is worth
      # keeping straight rather than smoothing over. Heroku's registry rejects
      # OCI manifests, which is what the GHCR push above produces along with
      # its signed provenance. So this builds again with Docker media types,
      # from the same commit, and the result has a DIFFERENT digest.
      #
      # That is the honest shape of the two deployments: Phala is the one that
      # can be verified from public source to running enclave; Heroku is the
      # one that stays up for free while nobody is defending a thesis. Only the
      # first carries the attestation, and the docs say so.
      #
      # It also sidesteps what cost an evening locally: Docker Desktop's
      # containerd image store writes OCI manifests whatever you ask for, so a
      # push to Heroku from a laptop fails with a bare "unsupported". A CI
      # runner has no such store and buildx can simply be told the format.
      # Heroku's registry takes the API key as the password and ignores the
      # user, which is what `heroku container:login` does under the hood.
      - name: Log in to the Heroku registry
        if: inputs.deploy_heroku
        uses: docker/login-action@v4
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Publish to Heroku
        if: inputs.deploy_heroku
        id: heroku
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          # Both off, and the media types forced: this is the combination
          # Heroku's registry accepts.
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          tags: registry.heroku.com/${{ env.HEROKU_APP }}/web
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # RELEASED THROUGH THE CLI, and the first attempt did it by hand.
      #
      # The Platform API takes `docker_image`, and the obvious value to give it
      # -- the digest `build-push-action` reports -- is the wrong one. That is
      # the MANIFEST digest; Heroku wants the IMAGE ID, which is the digest of
      # the image config inside that manifest. Passing the first returns a flat
      # `{"id":"not_found"}` that names neither field nor reason.
      #
      # Resolving it means a registry token dance and a manifest fetch, which
      # is exactly what `container:release` already does. Installing the CLI is
      # cheaper than owning a second implementation of somebody else's API.
      - name: Release it on Heroku
        if: inputs.deploy_heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g heroku --silent
          heroku container:release web -a "$HEROKU_APP"
          {
            echo ''
            echo "### Also released on Heroku"
            echo ''
            echo "\`$HEROKU_APP\` now runs the image built from this commit."
            echo ''
            echo 'NOT the attested digest: Heroku needs Docker media types, so this is a'
            echo 'second build of the same commit. The attestation covers the GHCR image.'
          } >> "$GITHUB_STEP_SUMMARY"
