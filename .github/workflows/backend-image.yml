# Builds the issuer image and publishes it, with proof of where it came from.
#
# WHY CI AND NOT A LAPTOP, which is the interesting part and not a convenience
# argument. The TEE attestation proves WHICH IMAGE is running. On its own that
# is half a guarantee: somebody still has to believe the image corresponds to
# the source they read. Build it here and the chain closes, link by link, and
# every link is public:
#
#   public commit -> public build log -> signed provenance -> image digest
#                 -> TEE attestation of that digest
#
# `actions/attest-build-provenance` is what signs the middle of that. It
# records the commit, the workflow and the runner that produced the digest, so
# anyone can run `gh attestation verify` against the published image and see
# whether it really came from this repository.
#
# It also means no long-lived token exists anywhere: `GITHUB_TOKEN` is minted
# for this run, can only write to this repository's packages, and expires when
# the job ends. GHCR does not accept fine-grained personal tokens, so the
# alternative would have been a classic one sitting on a laptop.
#
# ── THIS USED TO FIRE ONLY ON A TAG, and why it no longer does ───────────────
#
# The old rule was "deliberate releases only", because the compose pins a
# digest and a moving tag would let the measurement change under a running
# deployment. That reasoning is sound, but it was about WHAT THE ENCLAVE RUNS,
# not about when an image may be BUILT, and the two had been conflated.
#
# Publishing on every green commit is safe as long as three things hold, and
# they are enforced below rather than hoped for:
#
#   1. No version is ever reused. The patch number is bumped from the highest
#      `backend-v*` tag and the job refuses to overwrite one that exists. The
#      old flow republished `0.1.0` on every run, which silently moved the tag
#      that a pinned digest was supposed to make immutable.
#   2. Every published version is recorded in the repository as a tag, so a
#      digest can always be traced back to a commit somebody can read.
#   3. Nothing deploys itself. Moving Heroku or the CVM onto a new image stays
#      a separate, deliberate act: `deploy-heroku.yml` and `deploy-phala.yml`.

name: backend image

on:
  # Called by `checks.yml` once the tests are green, which is what makes this
  # automatic. It hands back the version and digest it produced, so a caller
  # can say what to pin.
  workflow_call:
    inputs:
      version:
        description: 'Version to publish. Empty bumps the patch.'
        required: false
        type: string
    outputs:
      version:
        description: 'The version that was published'
        value: ${{ jobs.publish.outputs.version }}
      digest:
        description: 'The digest of the published image'
        value: ${{ jobs.publish.outputs.digest }}

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, no leading v (e.g. 0.2.0). Empty bumps the patch.'
        required: false
        type: string

  # A hand-made tag still works, for a release somebody wants to name.
  push:
    tags:
      - 'backend-v*'

permissions:
  # `write` because this records each published version as a tag.
  contents: write
  packages: write
  # Sign the provenance. Without this the attestation step cannot mint the
  # short-lived identity it needs, and the chain above loses its middle link.
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # EVERY TAG, not just the last commit: the next version number is read
      # from the tags, so a shallow clone would compute the same number twice.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # DOCKER REFERENCES MUST BE LOWERCASE and the owner here is `CodeInIA`,
      # so interpolating it directly produces `ghcr.io/CodeInIA/...`, which the
      # registry rejects. GitHub offers no lowercase filter, so it is done here.
      - name: Lowercase the owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        env:
          # Through the environment rather than interpolated into the script:
          # a version somebody typed is untrusted text, and pasting it straight
          # into a shell line is how a workflow input becomes a shell command.
          PEDIDA: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${PEDIDA:-}" ]; then
            # Somebody named it: a minor or major bump, which no rule can guess.
            valor="$PEDIDA"
            origen="asked for"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # refs/tags/backend-v0.1.0 -> 0.1.0
            valor="${GITHUB_REF_NAME#backend-v}"
            origen="taken from the tag"
          else
            # THE AUTOMATIC CASE. Highest existing tag, patch plus one.
            # `sort -V` and not `sort`, or 0.1.10 would lose to 0.1.9.
            ultimo=$(git tag -l 'backend-v*' | sed 's/^backend-v//' | sort -V | tail -1)
            if [ -z "$ultimo" ]; then
              # NOTHING TO CONTINUE FROM, which is true exactly once: the first
              # versions were published by hand, before any of this existed.
              #
              # The compose is the right place to start from, because it names
              # the version that is actually deployed. Seeding a tag by hand
              # instead would have meant pushing `backend-v0.1.0`, which fires
              # the tag trigger below, which republishes 0.1.0 -- moving the
              # registry tag away from the digest the enclave was attested on.
              # The cure would have been worse than the gap.
              ultimo=$(grep -o 'votain-backend:[0-9.]*' docker-compose.yml | head -1 | cut -d: -f2)
              [ -n "$ultimo" ] || { echo "No tag and no version in the compose."; exit 1; }
              echo "No backend-v* tag yet; continuing from the compose ($ultimo)."
            fi
            mayor=${ultimo%%.*}
            resto=${ultimo#*.}
            menor=${resto%%.*}
            parche=${resto#*.}
            valor="$mayor.$menor.$((parche + 1))"
            origen="bumped from $ultimo"
          fi

          case "$valor" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "Not a version: $valor"; exit 1 ;;
          esac

          echo "value=$valor" >> "$GITHUB_OUTPUT"
          echo "Publishing $valor ($origen)"

          # REFUSING TO REUSE A VERSION IS THE WHOLE SAFETY PROPERTY HERE.
          # A digest pinned in the compose is only immutable if the tag beside
          # it never moves. Skipped when a tag push triggered this, because
          # then the tag is supposed to exist already.
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ] && git rev-parse -q --verify "refs/tags/backend-v$valor" >/dev/null; then
            echo "backend-v$valor already exists. Pick another version."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          # ONE PLATFORM, ON PURPOSE. The Phala CVM runs amd64. Building arm64
          # as well doubles the push for an architecture nothing here uses,
          # and an image that resolved to arm64 would simply not start there.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/votain-backend:${{ steps.version.outputs.value }}
          # Layers are cached in the registry, so a source-only change does not
          # reinstall 400 MB of zero-knowledge dependencies from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # v4 is a thin wrapper over `actions/attest`, which is where upstream says
      # new work should go. The inputs below are unchanged, so this stays as it
      # is until there is a reason to touch the one step whose output the whole
      # verification story rests on.
      - name: Attest the provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/votain-backend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # RECORDED IN THE REPOSITORY, so a digest can be traced to a commit
      # without trusting a build log to still be there.
      #
      # This does not loop, and that is worth knowing rather than discovering:
      # a push made with `GITHUB_TOKEN` does not trigger another workflow run,
      # so tagging here cannot set off the `push: tags:` trigger above.
      - name: Tag the commit
        if: ${{ github.ref_type != 'tag' }}
        run: |
          set -euo pipefail
          etiqueta="backend-v${{ steps.version.outputs.value }}"
          git tag "$etiqueta" "$GITHUB_SHA"
          git push origin "$etiqueta"
          echo "tagged $etiqueta"

      - name: Say what to pin
        run: |
          referencia="ghcr.io/${{ steps.owner.outputs.value }}/votain-backend:${{ steps.version.outputs.value }}@${{ steps.push.outputs.digest }}"
          {
            echo "### Image published"
            echo ''
            echo 'Pin this digest in `docker-compose.yml`, not the tag:'
            echo ''
            echo '```'
            echo "$referencia"
            echo '```'
            echo ''
            echo 'Verify it came from this repository:'
            echo ''
            echo '```'
            echo "gh attestation verify oci://ghcr.io/${{ steps.owner.outputs.value }}/votain-backend:${{ steps.version.outputs.value }} --repo ${{ github.repository }}"
            echo '```'
            echo ''
            echo 'Nothing is deployed by this workflow. Run *deploy heroku* or'
            echo '*deploy phala* to move a deployment onto it.'
          } >> "$GITHUB_STEP_SUMMARY"
