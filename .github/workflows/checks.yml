# Does the repository still work.
#
# Runs on every push to `main` and on pull requests into it. `main` is the
# branch the frontend deploys from, so this is the thing that should have an
# opinion before anything reaches `votain.app`.
#
# THREE JOBS RATHER THAN ONE, and not for speed alone. A red tick that says
# "checks failed" tells you nothing; three say WHICH half of the project broke,
# and the contracts suite is slow enough that it should not hold up the answer
# about the frontend.
#
# Each module is tested the same way it is tested locally, on purpose. A CI
# that runs different commands is a CI that goes green while the repository is
# broken for whoever clones it.

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push supersedes the first: nothing is learned from finishing a run
  # against a commit nobody will deploy.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `npm run build` is `tsc -b && vite build`, so this covers types as well
      # as the bundle. It is also what 4EVERLAND runs, which is the point: if
      # this passes and that fails, the difference is configuration, not code.
      #
      # VITE_PUBLIC_URL IS REQUIRED and the build says so rather than guessing:
      # it fills the canonical link, the Open Graph URLs, robots.txt and the
      # sitemap, and a wrong value there is invisible until a crawler records
      # it. Nothing else is set on purpose. This build is never served, so the
      # backend URL and the contract addresses would only be decoration; the
      # question being asked is whether the thing still compiles and bundles.
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PUBLIC_URL: https://votain.app
      - run: npm test
        working-directory: frontend
      # The file that keeps deep links working on IPFS. Cheap to lose in a
      # refactor of `public/`, and its absence only shows up as a 404 on a
      # reloaded route in production.
      - name: The SPA rewrite survived the build
        working-directory: frontend
        run: |
          test -f dist/_redirects || { echo "dist/_redirects is missing"; exit 1; }
          grep -q '/index.html' dist/_redirects || { echo "_redirects has no rewrite"; exit 1; }
          echo "ok: $(cat dist/_redirects | grep -v '^#' | grep -v '^$')"

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test
        working-directory: backend
      # The image is what actually gets deployed, so a Dockerfile that no
      # longer builds is a broken deployment waiting for somebody to notice.
      # Not pushed: this only asks whether it still builds.
      - uses: docker/setup-buildx-action@v4
      - name: The image still builds
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: npm run build
        working-directory: contracts
      # The slowest of the three by a wide margin: it proves Groth16 end to
      # end rather than mocking it.
      - run: npm test
        working-directory: contracts
        timeout-minutes: 30

  # ── the gate ────────────────────────────────────────────────────────────────
  #
  # 4EVERLAND deploys from a webhook and knows nothing about GitHub's checks,
  # so left to itself it publishes whatever lands on `main`, working or not.
  # This is the missing half: its Deploy Hook is OFF, and the only thing that
  # triggers a production deployment is this job, which cannot start until all
  # three above have passed.
  #
  # WHY NOT A RELEASE BRANCH, which was the other way to do it. That works, but
  # it makes `main` no longer mean "what is deployed" and adds a branch whose
  # only job is to lag behind another one. A webhook keeps one branch and one
  # meaning, and the gate lives where the checks already are.
  #
  # PUSHES ONLY. A pull request into `main` should be checked, not published.
  # THE BACKEND'S OTHER HALF OF THE SAME GATE. The frontend is published by
  # calling a hook; the backend is published by building an image, so the two
  # look different in this file while meaning the same thing: nothing reaches
  # the outside world over a red test.
  #
  # PUBLISHED, NOT DEPLOYED, and the distinction is the whole design. This
  # produces a new numbered version in the registry and a tag in the
  # repository; it does not move Heroku and it does not touch the enclave.
  # Those stay manual, in `deploy-heroku.yml` and `deploy-phala.yml`, because
  # deciding what the world talks to should be somebody's decision.
  # ── IS THERE A NEW IMAGE TO BUILD AT ALL ────────────────────────────────────
  #
  # Without this, every green commit on main published a version, and the first
  # three were 0.1.1, 0.1.2 and 0.1.3 for commits that changed a workflow and a
  # markdown file. It worked, and it made the version list meaningless: the
  # number no longer said anything about the backend, and picking out the one
  # that was defended meant reading three commit messages.
  #
  # COMPARED AGAINST THE LAST PUBLISHED TAG, not against the previous commit.
  # `backend-v*` marks the commit each image was built from, so this asks the
  # question that actually matters -- has the backend changed since the last
  # image? -- and gets it right for a push of several commits, a re-run, or a
  # force push, all of which defeat a HEAD~1 comparison.
  #
  # ONLY WHAT ENTERS THE IMAGE. The Dockerfile copies the manifests, the
  # tsconfig and `src`; nothing else can change the result. Listing them
  # explicitly is why `backend/DEVELOPMENT.md` no longer triggers a build that
  # Heroku then declines as identical. The workflow itself is included because
  # a change to HOW the image is built is a change to the image.
  cambios:
    name: has the backend changed
    needs: [frontend, backend, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.mirar.outputs.backend }}
      frontend: ${{ steps.mirar_frontend.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: mirar
        run: |
          set -euo pipefail
          ultimo=$(git tag -l 'backend-v*' | sort -V | tail -1)
          if [ -z "$ultimo" ]; then
            echo 'No published image to compare against, so build one.'
            echo 'backend=yes' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Exactly what the Dockerfile copies, plus the workflow that runs it.
          # Unquoted on purpose below: this is a list of paths and word
          # splitting is how it becomes several arguments.
          rutas='backend/package.json backend/package-lock.json'
          rutas="$rutas backend/tsconfig.json backend/src backend/Dockerfile"
          rutas="$rutas .github/workflows/backend-image.yml"
          # shellcheck disable=SC2086
          if git diff --quiet "$ultimo" HEAD -- $rutas; then
            echo "Nothing that enters the image has changed since $ultimo."
            echo 'backend=no' >> "$GITHUB_OUTPUT"
          else
            echo "Changed since $ultimo:"
            git diff --name-only "$ultimo" HEAD -- backend/ .github/workflows/backend-image.yml
            echo 'backend=yes' >> "$GITHUB_OUTPUT"
          fi

      # THE FRONTEND HAS NO TAG TO COMPARE AGAINST, because publishing it leaves
      # no mark in the repository: 4EVERLAND builds from the branch and answers
      # with a task id, not a version. So the baseline is the previous tip of
      # main, which `github.event.before` gives for a push and which covers
      # every commit in that push, not just the last one.
      #
      # WHEN IT CANNOT TELL, IT PUBLISHES. A force push leaves a `before` that
      # is no longer reachable, and a freshly created branch reports all zeros.
      # Guessing wrong in that direction costs a rebuild of a static site;
      # guessing wrong in the other leaves votain.app stale after a real change,
      # which is the failure nobody notices until somebody reports a bug that
      # was fixed a week ago.
      - id: mirar_frontend
        env:
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Three ways the baseline can be useless, checked one per line
          # rather than as one unreadable condition.
          sirve=yes
          [ -n "${ANTES:-}" ] || sirve=no
          [ "${ANTES:-}" != "0000000000000000000000000000000000000000" ] || sirve=no
          git cat-file -e "${ANTES:-}^{commit}" 2>/dev/null || sirve=no
          if [ "$sirve" = no ]; then
            echo 'No usable baseline, so publish rather than risk a stale site.'
            echo 'frontend=yes' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The whole directory, unlike the backend's explicit list: 4EVERLAND
          # runs its own build from these sources and what it picks up is its
          # decision, not something this file should try to predict.
          if git diff --quiet "$ANTES" HEAD -- frontend/; then
            echo 'Nothing under frontend/ changed.'
            echo 'frontend=no' >> "$GITHUB_OUTPUT"
          else
            echo 'Changed under frontend/:'
            git diff --name-only "$ANTES" HEAD -- frontend/
            echo 'frontend=yes' >> "$GITHUB_OUTPUT"
          fi

  image:
    name: publish the backend image
    needs: [frontend, backend, contracts, cambios]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main'
        && needs.cambios.outputs.backend == 'yes'
    # The called workflow declares what it needs; `permissions` cannot be
    # narrowed here without taking away the attestation's ability to sign.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/backend-image.yml

  # ── WHERE THE NEW IMAGE GOES, IF ANYWHERE ───────────────────────────────────
  #
  # Set by the AUTO_DEPLOY repository variable (Settings -> Secrets and
  # variables -> Actions -> Variables), so changing what happens after a green
  # commit is a dropdown, not a commit:
  #
  #   unset / none  publish the image and stop. The deployments move only when
  #                 somebody runs `deploy heroku` or `deploy phala` by hand.
  #   heroku        every green commit on main lands on api.votain.app. This is
  #                 the comfortable setting during development.
  #   phala         every green commit re-provisions the enclave.
  #
  # A VARIABLE AND NOT A SECRET, deliberately. Which deployment is automatic is
  # not confidential, and anyone reading a run should be able to see it.
  #
  # ON `phala`, AND WHY IT IS NOT THE DEFAULT. Each deployment restarts the CVM
  # and produces a new measurement. That is fine when a person decided it and
  # can point at the version; it is corrosive when it happens on its own,
  # because the property being demonstrated is that nothing about the running
  # backend changes without a decision somebody can be held to. It is offered
  # because it is your call, not because it is the obvious one.
  heroku:
    name: deploy to heroku
    needs: [image]
    if: vars.AUTO_DEPLOY == 'heroku'
    # The version just published, rather than "the newest tag": by the time
    # this runs another commit could have published a newer one, and deploying
    # something other than what this run built would make the log a liar.
    with:
      version: ${{ needs.image.outputs.version }}
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/deploy-heroku.yml

  phala:
    name: deploy to phala
    needs: [image]
    if: vars.AUTO_DEPLOY == 'phala'
    with:
      version: ${{ needs.image.outputs.version }}
    permissions:
      contents: write
      packages: read
    secrets: inherit
    uses: ./.github/workflows/deploy-phala.yml

  deploy:
    name: publish the frontend
    needs: [frontend, backend, contracts, cambios]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main'
        && needs.cambios.outputs.frontend == 'yes'
    runs-on: ubuntu-latest
    steps:
      # The URL IS the credential: anyone holding it can trigger a deployment,
      # which is why it lives in the repository secrets and not in this file.
      - name: Ask 4EVERLAND to publish
        env:
          HOOK: ${{ secrets.FOUREVERLAND_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "FOUREVERLAND_DEPLOY_HOOK is not set, so nothing was published."
            echo "Create the hook in 4EVERLAND (Settings -> Git -> Git Web Hooks)"
            echo "and add its URL as a repository secret."
            exit 1
          fi
          # GET, AND NOT POST, WHICH COST AN EVENING. Every deploy hook in the
          # world is a POST -- Vercel's, Netlify's, Render's -- so this was
          # written as one, and 4EVERLAND answered `503 {"code":500,"message":
          # "SERVICE ERROR"}`. That reads as "their service is down" or "your
          # hook is dead", and it is neither: the URL simply only answers GET,
          # and a 500 is what it returns instead of a 405. The same URL that
          # fails as a POST succeeds as a GET and queues the build.
          codigo=$(curl -sS -o /tmp/respuesta -w '%{http_code}' "$HOOK")
          echo "HTTP $codigo"
          cat /tmp/respuesta || true
          echo ''

          # TWO CHECKS, because a 200 is not enough on its own: this API puts
          # its real status in the body, so a transport-level success can still
          # carry `"code":500`. Accepting the HTTP status alone would give a
          # green tick over a deployment that never started.
          interno=$(jq -r '.code // empty' /tmp/respuesta 2>/dev/null || echo '')
          case "$codigo" in
            2*) : ;;
            *)  echo "4EVERLAND refused the hook (HTTP $codigo)"; exit 1 ;;
          esac
          if [ -n "$interno" ] && [ "$interno" != "200" ]; then
            echo "4EVERLAND answered 200 but reported code $interno"
            exit 1
          fi
          echo "deployment triggered"

  # ── MARKING WHAT SHIPPED ────────────────────────────────────────────────────
  #
  # A release exists for a state that actually reached somebody, and for no
  # other reason. A push that changes only documentation publishes nothing, so
  # it gets no release; its commits are not lost, they appear in the notes of
  # the next one, because the changelog spans everything since the previous
  # release rather than the last push.
  #
  # CALVER, NOT SEMVER, and not an accident. `backend-v*` already belongs to
  # the images, and the project as a whole has no semantic version: inventing
  # `v1.0.0` would be claiming a stability nobody has promised. A date says
  # exactly what it knows.
  #
  # `always()` is required because this depends on jobs that are SKIPPED in the
  # normal case: a commit that touches only the frontend skips `image`, and one
  # that touches only the backend skips `deploy`. Without it the release would
  # never run at all. The results are then checked by hand, so a skipped
  # publication is tolerated and a failed test is not.
  release:
    name: publish the release
    needs: [frontend, backend, contracts, cambios, image, deploy]
    if: |
      always()
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
        && needs.frontend.result == 'success'
        && needs.backend.result == 'success'
        && needs.contracts.result == 'success'
        && (needs.image.result == 'success' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # EVERY TAG AND EVERY COMMIT: the notes are the range between the last
      # release and this one, which a shallow clone cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the tag
        id: tag
        run: |
          set -euo pipefail
          # Read BEFORE the new tag is chosen, or the range would end up empty.
          anterior=$(git tag -l 'v20*' | sort -V | tail -1)
          echo "previous=${anterior:-}" >> "$GITHUB_OUTPUT"

          hoy=$(date -u +%Y.%m.%d)
          etiqueta="v$hoy"
          n=1
          while git rev-parse -q --verify "refs/tags/$etiqueta" >/dev/null; do
            n=$((n + 1))
            etiqueta="v$hoy-$n"
          done
          echo "value=$etiqueta" >> "$GITHUB_OUTPUT"
          echo "Releasing $etiqueta, previous ${anterior:-none}"

      - name: Write the notes
        env:
          ANTERIOR: ${{ steps.tag.outputs.previous }}
          VERSION_IMAGEN: ${{ needs.image.outputs.version }}
          DIGEST_IMAGEN: ${{ needs.image.outputs.digest }}
          HUBO_IMAGEN: ${{ needs.image.result }}
          HUBO_FRONTEND: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          # THE FIRST RELEASE HAS NOTHING BEHIND IT, and without a floor its
          # range would be the entire history: every commit since the project
          # began, in one set of notes nobody reads. The newest `backend-v*`
          # tag is the nearest real marker, and failing that the last
          # twenty-five commits, which is a changelog rather than an archive.
          if [ -n "${ANTERIOR:-}" ]; then
            rango="$ANTERIOR..HEAD"
          else
            base=$(git tag -l 'backend-v*' | sort -V | tail -1)
            if [ -n "$base" ]; then
              rango="$base..HEAD"
              echo "First release: starting from $base."
            else
              rango="-25"
              echo "First release and no tags at all: last 25 commits."
            fi
          fi
          git log $rango --no-merges --pretty=format:'%s' > asuntos.txt
          echo "$(wc -l < asuntos.txt) commits in range $rango"

          : > notas.md
          echo '## What shipped' >> notas.md
          echo '' >> notas.md
          if [ "$HUBO_FRONTEND" = success ]; then
            echo '- Frontend published to `votain.app` through 4EVERLAND.' >> notas.md
          fi
          if [ "$HUBO_IMAGEN" = success ]; then
            echo "- Backend image \`backend-v$VERSION_IMAGEN\`, with signed provenance." >> notas.md
            echo '' >> notas.md
            echo '  ```' >> notas.md
            echo "  ghcr.io/codeinia/votain-backend:$VERSION_IMAGEN@$DIGEST_IMAGEN" >> notas.md
            echo '  ```' >> notas.md
          fi
          echo '' >> notas.md

          # SUBJECTS ONLY. The commit bodies in this repository run to
          # paragraphs, which is right in a log and unreadable in release notes.
          # The conventional prefix is stripped once the line is under its own
          # heading, where repeating it says nothing.
          seccion() {
            local patron="$1" titulo="$2" lineas
            lineas=$(grep -E "$patron" asuntos.txt || true)
            if [ -n "$lineas" ]; then
              echo "### $titulo" >> notas.md
              echo '' >> notas.md
              printf '%s' "$lineas" | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' | sed 's/^/- /' >> notas.md
              echo '' >> notas.md
              echo '' >> notas.md
            fi
          }

          echo '## Changes' >> notas.md
          echo '' >> notas.md
          seccion '^feat(\(|!?:)' 'Features'
          seccion '^fix(\(|!?:)' 'Fixes'
          seccion '^perf(\(|!?:)' 'Performance'
          seccion '^(refactor|style)(\(|!?:)' 'Refactoring'
          seccion '^test(\(|!?:)' 'Tests'
          seccion '^(ci|build|chore)(\(|!?:)' 'Plumbing'
          seccion '^docs(\(|!?:)' 'Documentation'

          # Anything whose subject carries no recognised prefix. Dropping these
          # silently is how a real change goes unmentioned.
          otros=$(grep -vE '^(feat|fix|perf|refactor|style|test|ci|build|chore|docs)(\([^)]*\))?!?: ' asuntos.txt || true)
          if [ -n "$otros" ]; then
            echo '### Other' >> notas.md
            echo '' >> notas.md
            printf '%s' "$otros" | sed 's/^/- /' >> notas.md
            echo '' >> notas.md
          fi

          echo '' >> notas.md
          echo 'The contracts run on a development chain until the Amoy deployment.' >> notas.md
          cat notas.md

      - name: Publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          etiqueta="${{ steps.tag.outputs.value }}"
          gh release create "$etiqueta" --title "$etiqueta" --notes-file notas.md --target "$GITHUB_SHA"
          {
            echo "### Release $etiqueta"
            echo ''
            gh release view "$etiqueta" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"
