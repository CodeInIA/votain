# Does the repository still work.
#
# Runs on every push to `main` and on pull requests into it. `main` is the
# branch the frontend deploys from, so this is the thing that should have an
# opinion before anything reaches `votain.app`.
#
# THREE JOBS RATHER THAN ONE, and not for speed alone. A red tick that says
# "checks failed" tells you nothing; three say WHICH half of the project broke,
# and the contracts suite is slow enough that it should not hold up the answer
# about the frontend.
#
# Each module is tested the same way it is tested locally, on purpose. A CI
# that runs different commands is a CI that goes green while the repository is
# broken for whoever clones it.

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push supersedes the first: nothing is learned from finishing a run
  # against a commit nobody will deploy.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `npm run build` is `tsc -b && vite build`, so this covers types as well
      # as the bundle. It is also what 4EVERLAND runs, which is the point: if
      # this passes and that fails, the difference is configuration, not code.
      #
      # VITE_PUBLIC_URL IS REQUIRED and the build says so rather than guessing:
      # it fills the canonical link, the Open Graph URLs, robots.txt and the
      # sitemap, and a wrong value there is invisible until a crawler records
      # it. Nothing else is set on purpose. This build is never served, so the
      # backend URL and the contract addresses would only be decoration; the
      # question being asked is whether the thing still compiles and bundles.
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PUBLIC_URL: https://votain.app
      - run: npm test
        working-directory: frontend
      # The file that keeps deep links working on IPFS. Cheap to lose in a
      # refactor of `public/`, and its absence only shows up as a 404 on a
      # reloaded route in production.
      - name: The SPA rewrite survived the build
        working-directory: frontend
        run: |
          test -f dist/_redirects || { echo "dist/_redirects is missing"; exit 1; }
          grep -q '/index.html' dist/_redirects || { echo "_redirects has no rewrite"; exit 1; }
          echo "ok: $(cat dist/_redirects | grep -v '^#' | grep -v '^$')"

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test
        working-directory: backend
      # The image is what actually gets deployed, so a Dockerfile that no
      # longer builds is a broken deployment waiting for somebody to notice.
      # Not pushed: this only asks whether it still builds.
      - uses: docker/setup-buildx-action@v4
      - name: The image still builds
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: npm run build
        working-directory: contracts
      # The slowest of the three by a wide margin: it proves Groth16 end to
      # end rather than mocking it.
      - run: npm test
        working-directory: contracts
        timeout-minutes: 30

  # ── the gate ────────────────────────────────────────────────────────────────
  #
  # 4EVERLAND deploys from a webhook and knows nothing about GitHub's checks,
  # so left to itself it publishes whatever lands on `main`, working or not.
  # This is the missing half: its Deploy Hook is OFF, and the only thing that
  # triggers a production deployment is this job, which cannot start until all
  # three above have passed.
  #
  # WHY NOT A RELEASE BRANCH, which was the other way to do it. That works, but
  # it makes `main` no longer mean "what is deployed" and adds a branch whose
  # only job is to lag behind another one. A webhook keeps one branch and one
  # meaning, and the gate lives where the checks already are.
  #
  # PUSHES ONLY. A pull request into `main` should be checked, not published.
  # THE BACKEND'S OTHER HALF OF THE SAME GATE. The frontend is published by
  # calling a hook; the backend is published by building an image, so the two
  # look different in this file while meaning the same thing: nothing reaches
  # the outside world over a red test.
  #
  # PUBLISHED, NOT DEPLOYED, and the distinction is the whole design. This
  # produces a new numbered version in the registry and a tag in the
  # repository; it does not move Heroku and it does not touch the enclave.
  # Those stay manual, in `deploy-heroku.yml` and `deploy-phala.yml`, because
  # deciding what the world talks to should be somebody's decision.
  image:
    name: publish the backend image
    needs: [frontend, backend, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The called workflow declares what it needs; `permissions` cannot be
    # narrowed here without taking away the attestation's ability to sign.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/backend-image.yml

  deploy:
    name: publish the frontend
    needs: [frontend, backend, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The URL IS the credential: anyone holding it can trigger a deployment,
      # which is why it lives in the repository secrets and not in this file.
      - name: Ask 4EVERLAND to publish
        env:
          HOOK: ${{ secrets.FOUREVERLAND_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "FOUREVERLAND_DEPLOY_HOOK is not set, so nothing was published."
            echo "Create the hook in 4EVERLAND (Settings -> Git -> Git Web Hooks)"
            echo "and add its URL as a repository secret."
            exit 1
          fi
          # GET, AND NOT POST, WHICH COST AN EVENING. Every deploy hook in the
          # world is a POST -- Vercel's, Netlify's, Render's -- so this was
          # written as one, and 4EVERLAND answered `503 {"code":500,"message":
          # "SERVICE ERROR"}`. That reads as "their service is down" or "your
          # hook is dead", and it is neither: the URL simply only answers GET,
          # and a 500 is what it returns instead of a 405. The same URL that
          # fails as a POST succeeds as a GET and queues the build.
          codigo=$(curl -sS -o /tmp/respuesta -w '%{http_code}' "$HOOK")
          echo "HTTP $codigo"
          cat /tmp/respuesta || true
          echo ''

          # TWO CHECKS, because a 200 is not enough on its own: this API puts
          # its real status in the body, so a transport-level success can still
          # carry `"code":500`. Accepting the HTTP status alone would give a
          # green tick over a deployment that never started.
          interno=$(jq -r '.code // empty' /tmp/respuesta 2>/dev/null || echo '')
          case "$codigo" in
            2*) : ;;
            *)  echo "4EVERLAND refused the hook (HTTP $codigo)"; exit 1 ;;
          esac
          if [ -n "$interno" ] && [ "$interno" != "200" ]; then
            echo "4EVERLAND answered 200 but reported code $interno"
            exit 1
          fi
          echo "deployment triggered"
