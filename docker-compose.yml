# The issuer as Phala Cloud runs it, behind TLS that the enclave itself holds.
#
# Phala takes this file, starts it inside a Confidential VM and seals the
# environment to the MEASURED build. The values are NOT here and must never be:
# they are supplied through Phala's encrypted store, which encrypts them
# client-side before they reach the API, and `${VAR}` is how this file refers
# to them.
#
# WHY A TEE AT ALL, since it is the question a tribunal will ask. The issuer
# holds three secrets whose disclosure is not equally bad.
# `ISSUER_PRIVATE_KEY` signs credentials: a leak forges them from that moment,
# and rotating repairs it. `ENROLMENT_TAG_KEYS` is different in kind. World ID
# nullifiers are public and the tags sit on chain, so leaking it reconstructs
# who enrolled in which election, RETROACTIVELY, and no rotation undoes that.
# A TEE is what lets somebody verify that the process holding it is this code.
#
# Build and publish the image first:
#   docker build -t ghcr.io/codeinia/votain-backend:0.1.0 backend
#   docker push  ghcr.io/codeinia/votain-backend:0.1.0
#
# AND PIN IT. `latest` means the measurement can change under a running
# deployment, which is exactly what attestation exists to rule out. Bump the
# tag deliberately, or pin the digest.

services:
  # ── TLS, terminated inside the enclave ──────────────────────────────────────
  #
  # NOT the default dstack gateway, which serves `<id>.<phala-domain>` and
  # terminates TLS outside this VM. `dstack-ingress` obtains a Let's Encrypt
  # certificate for `api.votain.app` by DNS-01 and holds the private key
  # INSIDE the enclave, then publishes evidence that it does.
  #
  # That is the difference between "trust me, the issuer runs in a TEE" and
  # "here is proof that the thing answering on this domain is the TEE", and it
  # is the half of the argument the memoria actually needs.
  #
  # Pinned by digest on purpose: this container terminates TLS for the whole
  # API, so a moving tag here would be a moving trust boundary.
  ingress:
    image: dstacktee/dstack-ingress:2.2@sha256:d05a7b343c37c1cca1bba8dbf7e8f3c6d2118158af2d41c455103796db4f67f0
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Internal only. The issuer is not published directly; everything
      # arrives through here.
      TARGET_ENDPOINT: http://issuer:3000
      GATEWAY_DOMAIN: gateway.${DSTACK_GATEWAY_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      # Scoped to editing DNS for this zone and nothing else. See the note in
      # the deployment checklist before minting it.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Publishes a CAA record, so no other authority can issue for this name.
      SET_CAA: "true"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - /var/run/tappd.sock:/var/run/tappd.sock
      # The certificate survives a restart. It does NOT survive deleting the
      # CVM, which is fine: a recreated one asks Let's Encrypt again. Only
      # relevant if you recreate many times in a week, where their duplicate
      # certificate limit starts to bite.
      - cert-data:/etc/letsencrypt
      - evidences:/evidences

  # ── the issuer ──────────────────────────────────────────────────────────────
  issuer:
    # PINNED BY DIGEST, not by tag, and the digest is the point. A tag can be
    # moved to other content; this cannot. It is what `gh attestation verify`
    # binds to commit a8306863, so pinning it is what makes the TEE's
    # measurement traceable all the way back to source somebody can read:
    #   gh attestation verify oci://ghcr.io/codeinia/votain-backend:0.1.0     #     --repo CodeInIA/votain
    image: ghcr.io/codeinia/votain-backend:0.1.3@sha256:2cfad10ab78b35044d747b228536ea406fb287a52002432bc3b8f0a2d2ff480f
    restart: unless-stopped
    # NO `ports`. Reachable only from `ingress`, over the compose network.
    # Publishing it too would put an unencrypted 3000 beside the TLS the
    # enclave just went to the trouble of holding.
    expose:
      - "3000"
    environment:
      # ── how it presents itself ──
      NODE_ENV: production
      PORT: 3000
      # ANSWER ON THE COMPOSE NETWORK, not only on this container's loopback.
      # In production the server binds to 127.0.0.1 by default, which is right
      # behind a proxy on the same machine and useless behind one in another
      # container: the process comes up, says so in the log, and `ingress`
      # cannot reach it. Still not exposed outside — this service publishes no
      # ports.
      BIND_ADDRESS: 0.0.0.0
      # Behind the ingress, so the client IP arrives in a header. Without this
      # the rate limiters see one address for every voter on earth.
      TRUST_PROXY: "1"
      # Where the app is. Also what every mobile return link is validated
      # against, so leaving it empty silently drops World ID's `return_to`
      # and Self's callback, and the voter is offered no way back.
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # This host, as it appears inside published revocation-list URLs.
      PUBLIC_URL: ${PUBLIC_URL}
      ISSUER_DID: ${ISSUER_DID}

      # ── World ID ──
      # Read here rather than in the browser: the proof request is opened by
      # this process so that a verification survives a phone discarding the
      # tab its owner left to approve it.
      WORLD_ID_APP_ID: ${WORLD_ID_APP_ID}
      WORLD_ID_RP_ID: ${WORLD_ID_RP_ID}
      WORLD_ID_ACTION: ${WORLD_ID_ACTION}
      DEVELOPER_KEY: ${DEVELOPER_KEY}

      # ── the secrets the TEE is for ──
      ISSUER_PRIVATE_KEY: ${ISSUER_PRIVATE_KEY}
      ELIGIBILITY_ATTESTER_PRIVATE_KEY: ${ELIGIBILITY_ATTESTER_PRIVATE_KEY}
      # One independent key per UTC month. Irrecoverable: lose the key for an
      # epoch and no election created that month can accept another enrolment.
      ENROLMENT_TAG_KEYS: ${ENROLMENT_TAG_KEYS}
      ADMIN_TOKEN: ${ADMIN_TOKEN}

      # ── chain ──
      # THESE MUST BE SET HERE, and this is the one that bites. Locally the
      # backend reads `contracts/deployments/*.json` and the addresses can stay
      # blank in `.env`. A container has no `contracts/` directory beside it,
      # and `chain/deployments.ts` treats that as normal and falls back to the
      # environment — so blank here is not an error, it is a backend calling
      # addresses that do not exist.
      CHAIN_NETWORK: ${CHAIN_NETWORK}
      CHAIN_RPC_URL: ${CHAIN_RPC_URL}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS}
      PAYMASTER_ADDRESS: ${PAYMASTER_ADDRESS}
      REGISTRAR_PRIVATE_KEY: ${REGISTRAR_PRIVATE_KEY}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY}

      # ── Self, for document-backed eligibility ──
      # The relayer calls the endpoint from OUTSIDE, unauthenticated by
      # design, so it has to be this deployment's public address.
      SELF_ENDPOINT: ${SELF_ENDPOINT}
      SELF_MOCK: ${SELF_MOCK}

    # Cheap and honest: /health touches nothing and allocates nothing, so a
    # pass means the process is up, not that the chain or World ID are.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cert-data:
  evidences:
